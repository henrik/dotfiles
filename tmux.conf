set-option -g default-command "tmux-shell-wrapper"

# Make shift+arrows, ctrl+arrows etc work in Vim.
set -g xterm-keys on

# Let apps (like Vim) know when the pane gains/loses focus.
set -g focus-events on

# See if this fixes slow ESC issues.
# http://unix.stackexchange.com/questions/23138/esc-key-causes-a-small-delay-in-terminal-due-to-its-alt-behavior
set -s escape-time 0

# Start window and pane indices at 1.
set -g base-index 1
set -g pane-base-index 1

# Status bar styling and content.
set -g status-bg black
set -g status-fg white
# Show when resize mode is active, since bare arrows behave differently there.
set -g status-left-length 40
set -g status-left '#{?#{==:#{client_key_table},resize},#[bg=colour208 fg=black] RESIZE #[default] ,}#S '

# Show keyboard layout in prompt, assuming some script writes it to that path;
# it's "/User/…" instead of "~" so VMs can read from their symlinked OS X host home directory.
set -g status-right '#(cat /Users/$USER/.keyboard_layout 2> /dev/null) | #22T | %H:%M %d-%b-%y'
set -g status-right-length 60
set -g status-interval 2

# Highlight the active window in the status bar.
set-window-option -g window-status-current-style bg=yellow,fg=black

# Distinguish the active pane.
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=colour232'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=yellow'
set -g pane-border-indicators arrows
set -g pane-border-status top

# Pane label: an explicit name set with prefix+P wins, then any title the app sets (Vim, Claude), then the "P1" fallback for a plain shell.
set -g pane-border-format '#{?pane_active,#[bg=yellow fg=black],#[fg=colour238]} #{?#{@name},#{@name},#{?#{==:#{pane_title},#{host_short}},P#P,#{pane_title}}} '

# Don't prompt to kill panes/windows.
bind-key x kill-pane
bind-key & kill-window

# Cycle panes.
bind b select-pane -t :.+
bind C-b select-pane -t :.+

# Name the current pane. Submit an empty name to fall back to the default label.
bind-key P command-prompt -I "#{@name}" -p "Pane name:" "set -p @name '%%'"

# More intuitive split-window mappings.
bind "'" split-window -h
bind - split-window -v

# Maximize pane, e.g. for copying.
bind-key z resize-pane -Z

# Switch pane and zoom
# https://twitter.com/tskogberg/status/792025881573199872
bind C-z select-pane -t :.+ \; resize-pane -Z

# Reload tmux conf.
unbind r
bind r source-file ~/.tmux.conf\; display "Reloaded conf."

# http://robots.thoughtbot.com/tmux-copy-paste-on-os-x-a-better-future

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Unbork my iTerm ctrl+1 etc mappings in tmux 2.1
# https://github.com/tmux/tmux/issues/159
set -g assume-paste-time 0

set -g history-limit 9999

# Allow escape sequences (e.g. iTerm2 file downloads) to pass through to the terminal.
set -g allow-passthrough on

# Mouse support, mainly to drag pane borders to resize splits.
# Note that this makes tmux capture drags, so hold option in iTerm2 for native text selection.
set -g mouse on

# Sticky resize mode: prefix+R, then arrows or hjkl resize repeatedly with no modifiers held.
# Any unbound key (Escape, q, Enter) leaves the mode. Note that prefix+M-arrow and prefix+C-arrow still resize directly.
bind R switch-client -T resize
bind -T resize Left  resize-pane -L 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize
bind -T resize Up    resize-pane -U 3 \; switch-client -T resize
bind -T resize Down  resize-pane -D 3 \; switch-client -T resize
bind -T resize h     resize-pane -L 5 \; switch-client -T resize
bind -T resize l     resize-pane -R 5 \; switch-client -T resize
bind -T resize k     resize-pane -U 3 \; switch-client -T resize
bind -T resize j     resize-pane -D 3 \; switch-client -T resize
